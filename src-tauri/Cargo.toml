[package]
name = "dahara-fuel-calc"
version = "0.1.1"
description = "iRacing fuel calculator overlay"
authors = ["DAHARA"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dahara_fuel_calc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
