[package]
name = "dahara-fuel-calc"
version = "0.2.0"
description = "iRacing fuel calculator overlay"
authors = ["DAHARA"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dahara_fuel_calc_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
futures = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pitwall = { version = "0.1", features = ["derive"] }
pitwall-tauri = "0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
